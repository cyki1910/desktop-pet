# ============================================================
# 云端自动打包 macOS 桌宠（GitHub Actions）
#
# 作用：只要推送到 GitHub，云端会自动用 Mac 环境：
#    装 Python → 装 PyInstaller/PySide6 → 打出 桌宠.app
#  你朋友无需安装任何环境，直接下载成品 .app 双击即用。
#
# 触发方式：
#   1) 手动触发：仓库 Actions 页点 "Run workflow"
#   2) 打 tag 触发：git tag v1.0 && git push --tags
#   3) 推送到 main 也会跑
#
# 成品下载：
#   Actions 运行完成后，在本次运行的底部 "Artifacts" 里下载
#  "desktop-pet-macos"，解压得到 桌宠.app
# ============================================================
name: Build macOS Desktop Pet

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build 桌宠.app (macOS)
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6

      - name: 打包成 .app
        run: |
          pyinstaller --noconfirm --windowed \
            --name 桌宠 \
            --add-data "pet_big.png:." \
            pet.py

      - name: 上传成品（.app）
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-macos
          path: dist/桌宠.app
          if-no-files-found: error
