# ============================================================
# 云端自动打包 macOS 桌宠（Tauri 版）
# 推送到 GitHub 后自动触发，产物是 ~10MB 的 桌宠.app
# 成品在 Actions 运行页底部 Artifacts 下载：desktop-pet-macos
# ============================================================
name: Build macOS Desktop Pet (Tauri)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build 桌宠.app (macOS, Tauri)
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: 安装前端依赖
        run: npm install
        working-directory: tauri

      - name: 打包 .app（Universal：同时支持 Apple 芯片与 Intel）
        run: npx tauri build --target universal-apple-darwin
        working-directory: tauri

      - name: 上传成品（.app）
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-macos
          path: tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          path-separator: '/'
          if-no-files-found: error
